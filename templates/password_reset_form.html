{% extends 'base.html' %}
{% block content %}
<div class="container" style="max-width:400px;margin-top:80px;">
  <h2>找回密码</h2>
  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label for="id_email">请输入注册邮箱：</label>
      {{ form.email }}
    </div>
    <button type="submit" class="btn btn-primary">发送重置邮件</button>
  </form>
  <a href="{% url 'login' %}">返回登录</a>
</div>
{% endblock %}
