<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{% block title %}WebSocket 聊天室{% endblock %}</title>
  <style>
    nav { padding: 10px; background: #f3f3f3; display: flex; gap: 12px; align-items: center; }
    #accountModal { position: fixed; top: 15%; right: 15%; background: #fff; border: 1px solid #ccc; box-shadow: 0 2px 8px rgba(0,0,0,0.15); padding: 16px; display: none; }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'index' %}">首页</a>
    {% if request.user.is_authenticated %}
      <button id="accountBtn">账户</button>
      <a href="{% url 'logout' %}">退出</a>
    {% else %}
      <span>未登录</span>
    {% endif %}
  </nav>

  <div id="accountModal">
    <h3>账户信息</h3>
    <p>用户名：{{ request.user.username }}</p>
    <p>昵称：{{ nickname|default:request.user.username }}</p>
    <button id="closeAccount">关闭</button>
  </div>

  {% block content %}{% endblock %}

  <script>
  (function(){
    var btn = document.getElementById('accountBtn');
    var modal = document.getElementById('accountModal');
    var close = document.getElementById('closeAccount');
    if(btn){ btn.addEventListener('click', function(){ modal.style.display = 'block'; }); }
    if(close){ close.addEventListener('click', function(){ modal.style.display = 'none'; }); }
  })();
  </script>
</body>
</html>
